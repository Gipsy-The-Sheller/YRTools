[paths]
# Python installation directory
python_home=python

# Python executable (relative to python_home)
python_exe=pythonw.exe

# Main script to run (relative to launcher directory)
script=main.py

# MSYS2 installation directory (optional)
msys2_home=msys64

[environment]
# Additional environment variables (optional)
# PYTHONHOME is automatically set to python_home
# PYTHONPATH is automatically set to script directory + python_home
# PATH is automatically updated to include python_home, python_home\Scripts, and msys2_home\usr\bin